<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLASSIFIED // DECRYPTED LEAK VIEWER</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #d0d0d0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        /* Top Secret Leak Stamp Banner */
        .leak-banner {
            width: 100%;
            max-width: 750px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff3333;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .classification {
            color: #ff3333;
            font-weight: bold;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        .file-meta-top {
            font-size: 0.65rem;
            color: #777;
            text-align: right;
        }

        /* Mobile-Optimized Scrollable Container */
        .pdf-container {
            width: 100%;
            max-width: 650px;
            height: 78vh;
            background-color: #000000;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            position: relative;
            overflow-y: auto; /* Enables vertical scrolling on mobile */
            -webkit-overflow-scrolling: touch; /* Fixes momentum scrolling on iOS */
            display: flex;
            justify-content: center;
        }

        .pdf-frame {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000000;
        }

        /* Watermark stamp across viewer */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 2rem;
            color: rgba(255, 51, 51, 0.04);
            font-weight: bold;
            letter-spacing: 5px;
            pointer-events: none;
            z-index: 1;
            white-space: nowrap;
        }

        .footer-note {
            margin-top: 10px;
            font-size: 0.7rem;
            color: #555;
            text-align: center;
            max-width: 750px;
        }
    </style>
</head>
<body>

    <div class="leak-banner">
        <span class="classification">CONFIDENTIAL // EYES ONLY</span>
        <div class="file-meta-top">
            DOC_ID: KW-09-2009-REDEMPTION
        </div>
    </div>

    <div class="pdf-container">
        <div class="watermark">YEEZY SOUND LEAK</div>
        <!-- 
          #toolbar=0 -> Hides toolbar
          #navpanes=0 -> Hides navigation
          #view=FitH -> Fits the page width nicely on mobile screens
        -->
        <iframe src="KW.09.2009.PRJCT.REDEMPTION.NOTEBOOK1.pdf#toolbar=0&navpanes=0&view=FitH" class="pdf-frame"></iframe>
    </div>

    <div class="footer-note">
        [SECURE VIEWER ACTIVE] Scroll down to view all pages.
    </div>

</body>
</html>
